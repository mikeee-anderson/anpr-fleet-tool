# One command: `docker compose up --build`, then open http://localhost:8000/docs
# Runs without any credentials: plates are printed to the console.
# To log to Google Sheets, copy backend/anpr-server/.env.example to .env and fill it in.
services:
  backend:
    build: ./backend/anpr-server
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/anpr-server/.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
